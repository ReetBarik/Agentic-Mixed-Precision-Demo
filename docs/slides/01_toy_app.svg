<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #172033; }
    .subtitle { font-size: 14px; fill: #5b6475; }
    .h { font-size: 16px; font-weight: 650; fill: #172033; }
    .lbl { font-size: 14px; font-weight: 600; fill: #172033; }
    .sub { font-size: 12px; fill: #5b6475; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #172033; }
    .rnode { stroke: #64748b; stroke-width: 1.4; fill: #c7d2fe; }
    .rnode-warn { stroke: #b45309; stroke-width: 1.6; fill: #fde68a; }
    .rnode-tel { stroke: #64748b; stroke-width: 1.4; fill: #99f6e4; }
    .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .box { stroke: #64748b; stroke-width: 1; fill: #f1f5f9; }
    .th { font-size: 12px; font-weight: 700; fill: #172033; }
    .td { font-size: 12px; fill: #172033; }
    .caption { font-size: 12px; fill: #5b6475; font-style: italic; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" class="title">Toy app: 6-region kernel</text>
  <text x="40" y="66" class="subtitle">Reference example for the rest of the deck. Loosely mimics a Feynman-integral kernel: form factors → intermediate reductions → final coefficient.</text>

  <!-- Left: source outline -->
  <text x="40" y="108" class="h">Source (annotated with tracked scopes)</text>
  <rect x="40" y="122" width="500" height="360" rx="6" class="box"/>
  <text x="56" y="146" class="code">double compute_coeff(inputs x, y, z, w) {</text>
  <text x="56" y="166" class="code">  tracked::scope s0("kernel");</text>

  <text x="56" y="192" class="code">  { tracked::scope s("R1_form_A");</text>
  <text x="56" y="208" class="code">    a = mul(x, y) + add(x, z);              // safe range</text>
  <text x="56" y="224" class="code">  }</text>

  <text x="56" y="250" class="code">  { tracked::scope s("R2_form_B");</text>
  <text x="56" y="266" class="code">    b = sub(x*x, y*y) - z;                  // near-cancellation</text>
  <text x="56" y="282" class="code">  }</text>

  <text x="56" y="308" class="code">  { tracked::scope s("R3_form_C");</text>
  <text x="56" y="324" class="code">    c = log(1.0 + w) + mul(w, w);           // log near root</text>
  <text x="56" y="340" class="code">  }</text>

  <text x="56" y="366" class="code">  { tracked::scope s("R4_reduce_AB");</text>
  <text x="56" y="382" class="code">    ab = div(a + b, a - b);                 // consumes R1,R2</text>
  <text x="56" y="398" class="code">  }</text>

  <text x="56" y="424" class="code">  { tracked::scope s("R5_reduce_C");</text>
  <text x="56" y="440" class="code">    cc = sqrt(mul(c, c) + 1.0);             // consumes R3</text>
  <text x="56" y="456" class="code">  }</text>

  <text x="56" y="482" class="code">  { tracked::scope s("R6_assemble");</text>
  <text x="56" y="498" class="code">    return mul(ab, cc) + sub(ab, cc);       // hot loop</text>
  <text x="56" y="514" class="code">  }</text>
  <text x="56" y="534" class="code">}</text>

  <!-- Right: DAG -->
  <text x="600" y="108" class="h">Region DAG</text>
  <text x="600" y="128" class="sub">Edges = data-flow dependencies (producer → consumer)</text>

  <!-- DAG group -->
  <g transform="translate(600, 150)">
    <!-- Level 0: R1 R2 R3 -->
    <rect x="20" y="10" width="100" height="60" rx="8" class="rnode"/>
    <text x="70" y="35" text-anchor="middle" class="lbl">R1</text>
    <text x="70" y="52" text-anchor="middle" class="sub">form_A</text>

    <rect x="150" y="10" width="100" height="60" rx="8" class="rnode-warn"/>
    <text x="200" y="35" text-anchor="middle" class="lbl">R2</text>
    <text x="200" y="52" text-anchor="middle" class="sub">form_B  (range!)</text>

    <rect x="280" y="10" width="100" height="60" rx="8" class="rnode-tel"/>
    <text x="330" y="35" text-anchor="middle" class="lbl">R3</text>
    <text x="330" y="52" text-anchor="middle" class="sub">form_C  (log)</text>

    <!-- Level 1: R4 R5 -->
    <rect x="80" y="140" width="100" height="60" rx="8" class="rnode"/>
    <text x="130" y="165" text-anchor="middle" class="lbl">R4</text>
    <text x="130" y="182" text-anchor="middle" class="sub">reduce_AB</text>

    <rect x="240" y="140" width="100" height="60" rx="8" class="rnode"/>
    <text x="290" y="165" text-anchor="middle" class="lbl">R5</text>
    <text x="290" y="182" text-anchor="middle" class="sub">reduce_C</text>

    <!-- Level 2: R6 -->
    <rect x="160" y="270" width="100" height="60" rx="8" class="rnode"/>
    <text x="210" y="295" text-anchor="middle" class="lbl">R6</text>
    <text x="210" y="312" text-anchor="middle" class="sub">assemble</text>

    <!-- Edges -->
    <path d="M70 70 L110 140" class="edge"/>
    <path d="M200 70 L150 140" class="edge"/>
    <path d="M330 70 L295 140" class="edge"/>
    <path d="M140 200 L195 270" class="edge"/>
    <path d="M280 200 L225 270" class="edge"/>
  </g>

  <!-- Legend for DAG colors -->
  <g transform="translate(600, 500)">
    <text x="0" y="0" class="h">Legend</text>
    <rect x="0" y="12" width="18" height="14" class="rnode"/>
    <text x="26" y="24" class="sub">safe region</text>
    <rect x="130" y="12" width="18" height="14" class="rnode-warn"/>
    <text x="156" y="24" class="sub">value_range_ok_for_float = false</text>
    <rect x="370" y="12" width="18" height="14" class="rnode-tel"/>
    <text x="396" y="24" class="sub">high predicted_rel_err_if_float (telemetry only)</text>
  </g>

  <!-- Bottom: flop weights table -->
  <g transform="translate(40, 570)">
    <text x="0" y="0" class="h">Per-region signals (from characterization)</text>
    <rect x="0" y="12" width="1200" height="118" rx="4" class="box"/>

    <text x="20" y="34" class="th">region</text>
    <text x="130" y="34" class="th">op_counts (dominant)</text>
    <text x="380" y="34" class="th">flop weight</text>
    <text x="500" y="34" class="th">range-safe?</text>
    <text x="620" y="34" class="th">predicted_rel_err_if_float</text>
    <text x="880" y="34" class="th">consumers</text>
    <text x="1030" y="34" class="th">role in DAG</text>

    <line x1="0" y1="42" x2="1200" y2="42" stroke="#94a3b8" stroke-width="1"/>

    <text x="20" y="60" class="td">R1  form_A</text>
    <text x="130" y="60" class="td">2 add, 2 mul</text>
    <text x="380" y="60" class="td">50</text>
    <text x="500" y="60" class="td">✓</text>
    <text x="620" y="60" class="td">low</text>
    <text x="880" y="60" class="td">[R4]</text>
    <text x="1030" y="60" class="td">leaf</text>

    <text x="20" y="76" class="td">R2  form_B</text>
    <text x="130" y="76" class="td">2 mul, 2 sub  (near-cancel)</text>
    <text x="380" y="76" class="td">30</text>
    <text x="500" y="76" class="td" fill="#b45309">✗ (unsafe)</text>
    <text x="620" y="76" class="td">low</text>
    <text x="880" y="76" class="td">[R4]</text>
    <text x="1030" y="76" class="td">leaf</text>

    <text x="20" y="92" class="td">R3  form_C</text>
    <text x="130" y="92" class="td">1 log, 1 add, 1 mul</text>
    <text x="380" y="92" class="td">45</text>
    <text x="500" y="92" class="td">✓</text>
    <text x="620" y="92" class="td" fill="#0f766e">high (telemetry)</text>
    <text x="880" y="92" class="td">[R5]</text>
    <text x="1030" y="92" class="td">leaf</text>

    <text x="20" y="108" class="td">R4  reduce_AB</text>
    <text x="130" y="108" class="td">1 div, 1 add, 1 sub</text>
    <text x="380" y="108" class="td">100</text>
    <text x="500" y="108" class="td">✓</text>
    <text x="620" y="108" class="td">low</text>
    <text x="880" y="108" class="td">[R6]</text>
    <text x="1030" y="108" class="td">depth 1</text>

    <text x="20" y="124" class="td">R5  reduce_C</text>
    <text x="130" y="124" class="td">1 sqrt, 1 mul, 1 add</text>
    <text x="380" y="124" class="td">80</text>
    <text x="500" y="124" class="td">✓</text>
    <text x="620" y="124" class="td">low</text>
    <text x="880" y="124" class="td">[R6]</text>
    <text x="1030" y="124" class="td">depth 1</text>
  </g>
  <text x="40" y="710" class="caption">R6 (mul + sub, weight 200, both consumers, depth 2) omitted from table for space — the highest-flop region and final DAG sink.</text>
</svg>
