<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #172033; }
    .h { font-size: 16px; font-weight: 650; fill: #172033; }
    .panel-title { font-size: 15px; font-weight: 700; fill: #172033; }
    .lbl { font-size: 14px; font-weight: 600; fill: #172033; }
    .sub { font-size: 12px; fill: #5b6475; }
    .sub-sm { font-size: 11px; fill: #5b6475; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #172033; }
    .box { stroke: #64748b; stroke-width: 1; fill: #f8fafc; }
    .queue-box { stroke: #166534; stroke-width: 1.6; fill: #f0fdf4; }
    .rnode-safe { stroke: #166534; stroke-width: 1.4; fill: #bbf7d0; }
    .rnode-warn { stroke: #b45309; stroke-width: 1.6; fill: #fde68a; }
    .rnode-sing { stroke: #475569; stroke-width: 1.4; fill: #cbd5e1; }
    .rung-safest { fill: #86efac; stroke: #166534; stroke-width: 1.4; }
    .rung-qf     { fill: #d9f99d; stroke: #4d7c0f; stroke-width: 1.4; }
    .rung-base   { fill: #f1f5f9; stroke: #475569; stroke-width: 1.6; }
    .rung-mid    { fill: #fed7aa; stroke: #b45309; stroke-width: 1.4; }
    .rung-risky  { fill: #fecaca; stroke: #991b1b; stroke-width: 1.4; }
    .rung-lbl { font-size: 15px; font-weight: 700; fill: #172033; }
    .rung-sub { font-size: 11px; fill: #5b6475; }
    .arrow-corr { stroke: #b45309; stroke-width: 2.2; fill: none; }
    .arrow-speed { stroke: #166534; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .verdict-accept { font-weight: 700; fill: #166534; }
    .verdict-reject { font-weight: 700; fill: #991b1b; }
    .th { font-size: 12px; font-weight: 700; fill: #172033; }
    .td { font-size: 12px; fill: #172033; }
  </style>
  <defs>
    <marker id="arrow-corr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-speed-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" class="title">Strategy walk — <tspan style="fill:#166534">speedup</tspan> phase</text>
  <text x="40" y="66" class="sub">Queue 2 of 2 — the four regions that already meet tolerance at double. Each single-steps down until a rung rejects.</text>

  <!-- ============ LEFT: precision ladder ============ -->
  <text x="40" y="108" class="h">Precision ladder</text>

  <g transform="translate(60, 130)">
    <!-- dd rung (top) -->
    <rect x="0" y="0" width="200" height="60" rx="8" class="rung-safest"/>
    <text x="100" y="26" text-anchor="middle" class="rung-lbl">dd</text>
    <text x="100" y="46" text-anchor="middle" class="rung-sub">106-bit mantissa · oracle</text>

    <!-- qf rung -->
    <rect x="0" y="82" width="200" height="60" rx="8" class="rung-qf"/>
    <text x="100" y="108" text-anchor="middle" class="rung-lbl">qf</text>
    <text x="100" y="128" text-anchor="middle" class="rung-sub">96-bit mantissa · four-float</text>

    <!-- double rung (baseline) -->
    <rect x="0" y="164" width="200" height="60" rx="8" class="rung-base"/>
    <text x="100" y="190" text-anchor="middle" class="rung-lbl">double</text>
    <text x="100" y="210" text-anchor="middle" class="rung-sub">53-bit mantissa · baseline</text>

    <!-- ff rung -->
    <rect x="0" y="246" width="200" height="60" rx="8" class="rung-mid"/>
    <text x="100" y="272" text-anchor="middle" class="rung-lbl">ff</text>
    <text x="100" y="292" text-anchor="middle" class="rung-sub">48-bit mantissa · pair-of-floats</text>

    <!-- float rung (bottom) -->
    <rect x="0" y="328" width="200" height="60" rx="8" class="rung-risky"/>
    <text x="100" y="354" text-anchor="middle" class="rung-lbl">float</text>
    <text x="100" y="374" text-anchor="middle" class="rung-sub">24-bit mantissa · fastest</text>

    <!-- Correctness arrows (solid): one rung up, inner lane -->
    <!-- double → qf -->
    <path d="M215 179 C 275 179, 275 112, 215 112" class="arrow-corr" marker-end="url(#arrow-corr-m)"/>
    <!-- qf → dd -->
    <path d="M215 97 C 275 97, 275 30, 215 30" class="arrow-corr" marker-end="url(#arrow-corr-m)"/>


    <!-- Speedup arrows (dotted): one rung down; same arc radius, arced further out than correctness -->
    <!-- dd → qf -->
    <path d="M215 30 C 385 30, 385 112, 215 112" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>
    <!-- qf → double -->
    <path d="M215 112 C 385 112, 385 194, 215 194" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>
    <!-- double → ff -->
    <path d="M215 194 C 385 194, 385 276, 215 276" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>
    <!-- ff → float -->
    <path d="M215 276 C 385 276, 385 358, 215 358" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>


    <!-- Legend under the ladder -->
    <text x="0" y="414" class="sub">↑ safer / slower</text>
    <text x="0" y="430" class="sub">↓ faster / riskier</text>

    <!-- Settle rule: one rung at a time, stop at the first reject -->
    <text x="0" y="454" class="sub-sm">speedup single-steps down and stops at the first reject —</text>
    <text x="0" y="470" class="sub-sm">the region settles at the last rung that was accepted.</text>

    <!-- Phase legend -->
    <line x1="0" y1="496" x2="36" y2="496" class="arrow-corr" marker-end="url(#arrow-corr-m)"/>
    <text x="46" y="500" class="lbl" style="fill:#b45309">correctness</text>
    <line x1="0" y1="520" x2="36" y2="520" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>
    <text x="46" y="524" class="lbl" style="fill:#166534">speedup</text>
  </g>

  <!-- ============ MIDDLE: speedup queue ============ -->
  <text x="500" y="108" class="h">Speedup queue  (flop-weighted)</text>

  <g transform="translate(500, 130)">
    <rect x="0" y="0" width="320" height="490" rx="8" class="queue-box"/>

    <text x="160" y="26" text-anchor="middle" class="panel-title">4 of 6 regions, heaviest first</text>

    <!-- queue entries: first single-step only; the walk decides how far each goes -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">1.  R6   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">flop weight: 200  ·  1 mul, 1 add, 1 sub</text>
    </g>
    <g transform="translate(16, 104)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">2.  R5   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">flop weight: 80  ·  1 sqrt, 1 mul, 1 add</text>
    </g>
    <g transform="translate(16, 160)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">3.  R1   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">flop weight: 50  ·  2 add, 2 mul</text>
    </g>
    <g transform="translate(16, 216)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-sing"/>
      <text x="10" y="18" class="lbl">4.  R3   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">flop weight: 45  ·  1 log, 1 add  (log)</text>
    </g>

    <!-- The two correctness regions are removed before this queue is ordered -->
    <line x1="16" y1="280" x2="304" y2="280" stroke="#166534" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="16" y="300" class="lbl">Excluded — correctness set (slide 4)</text>
    <text x="16" y="318" class="sub-sm">the correctness set is removed before this queue is</text>
    <text x="16" y="334" class="sub-sm">ordered — a region is never in both</text>

    <g transform="translate(16, 344)">
      <rect x="0" y="0" width="288" height="24" rx="4" class="rnode-warn"/>
      <text x="10" y="16" class="sub-sm">R2 · now at dd · up-bumped, not a candidate</text>
    </g>
    <g transform="translate(16, 372)">
      <rect x="0" y="0" width="288" height="24" rx="4" class="rnode-safe"/>
      <text x="10" y="16" class="sub-sm">R4 · now at qf · up-bumped, not a candidate</text>
    </g>

    <!-- Prune-check callout -->
    <g transform="translate(16, 424)">
      <text x="0" y="0" class="lbl">Prune check at dequeue</text>
      <text x="0" y="18" class="sub-sm">float_range_ok ✗ on R2 never fires here — R2 was</text>
      <text x="0" y="34" class="sub-sm">claimed by correctness and is not in this queue.</text>
      <text x="0" y="52" class="sub-sm">chain-dedup: R1, R3, R6 reuse one ff shim</text>
    </g>
  </g>

  <!-- ============ RIGHT: walk trace + result ============ -->
  <text x="850" y="108" class="h">Walk trace</text>

  <g transform="translate(850, 130)">
    <rect x="0" y="0" width="410" height="396" rx="8" class="box"/>

    <!-- header -->
    <rect x="0" y="0" width="410" height="26" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="10" y="18" class="th">step</text>
    <text x="50" y="18" class="th">region</text>
    <text x="115" y="18" class="th">attempt</text>
    <text x="240" y="18" class="th">verdict</text>
    <text x="320" y="18" class="th">new state</text>

    <!-- rows: background matches per-region character (queue color) -->
    <g font-size="12" fill="#172033">
      <!-- step 1: R6 double → ff accept -->
      <rect x="0" y="26" width="410" height="28" fill="#bbf7d0" stroke="#86efac"/>
      <text x="10" y="44">1</text>
      <text x="50" y="44">R6</text>
      <text x="115" y="44">double → ff</text>
      <text x="240" y="44" class="verdict-accept">accept ↓</text>
      <text x="320" y="44">R6 = ff</text>

      <!-- step 2: R6 keeps going, ff → float accept -->
      <rect x="0" y="54" width="410" height="46" fill="#bbf7d0" stroke="#86efac"/>
      <text x="10" y="74">2</text>
      <text x="50" y="74">R6</text>
      <text x="115" y="74">ff → float</text>
      <text x="240" y="74" class="verdict-accept">accept ↓</text>
      <text x="320" y="74">R6 = float</text>
      <text x="50" y="92" class="sub-sm" font-style="italic">each accept re-arms the walk one rung lower</text>

      <!-- step 3: R5 double → ff reject → settles at baseline -->
      <rect x="0" y="100" width="410" height="62" fill="#bbf7d0" stroke="#86efac"/>
      <text x="10" y="120">3</text>
      <text x="50" y="120">R5</text>
      <text x="115" y="120">double → ff</text>
      <text x="240" y="120" class="verdict-reject">reject</text>
      <text x="320" y="120">R5 = double</text>
      <text x="50" y="138" class="sub-sm" font-style="italic">prediction said ff was safe (5e-15); the measured build</text>
      <text x="50" y="154" class="sub-sm" font-style="italic">missed tol — the walk trusts the build, not the model.</text>

      <!-- step 4: R1 double → ff accept -->
      <rect x="0" y="162" width="410" height="28" fill="#bbf7d0" stroke="#86efac"/>
      <text x="10" y="180">4</text>
      <text x="50" y="180">R1</text>
      <text x="115" y="180">double → ff</text>
      <text x="240" y="180" class="verdict-accept">accept ↓</text>
      <text x="320" y="180">R1 = ff</text>

      <!-- step 5: R1 ff → float accept -->
      <rect x="0" y="190" width="410" height="28" fill="#bbf7d0" stroke="#86efac"/>
      <text x="10" y="208">5</text>
      <text x="50" y="208">R1</text>
      <text x="115" y="208">ff → float</text>
      <text x="240" y="208" class="verdict-accept">accept ↓</text>
      <text x="320" y="208">R1 = float</text>

      <!-- step 6: R3 double → ff accept -->
      <rect x="0" y="218" width="410" height="28" fill="#cbd5e1" stroke="#94a3b8"/>
      <text x="10" y="236">6</text>
      <text x="50" y="236">R3</text>
      <text x="115" y="236">double → ff</text>
      <text x="240" y="236" class="verdict-accept">accept ↓</text>
      <text x="320" y="236">R3 = ff</text>

      <!-- step 7: R3 ff → float reject → settles at ff -->
      <rect x="0" y="246" width="410" height="62" fill="#cbd5e1" stroke="#94a3b8"/>
      <text x="10" y="266">7</text>
      <text x="50" y="266">R3</text>
      <text x="115" y="266">ff → float</text>
      <text x="240" y="266" class="verdict-reject">reject</text>
      <text x="320" y="266">R3 = ff</text>
      <text x="50" y="284" class="sub-sm" font-style="italic">log near 1: 24-bit mantissa can't hold small-arg</text>
      <text x="50" y="300" class="sub-sm" font-style="italic">precision; ff's 48 bits was already the sweet spot</text>
    </g>

    <g transform="translate(10, 330)">
      <text x="0" y="0" class="sub-sm">Same no-retry rule: each (region, target) pair is tried at most once.</text>
      <text x="0" y="20" class="sub-sm">A region keeps stepping down while accepts hold, and settles at the</text>
      <text x="0" y="36" class="sub-sm">last accepted rung the moment one fails — R5's first step failed, so</text>
      <text x="0" y="52" class="sub-sm">it settles where it started, at double.</text>
    </g>
  </g>

  <!-- Precision distribution after speedup phase -->
  <g transform="translate(850, 546)">
    <text x="0" y="0" class="h">State after <tspan style="fill:#166534">speedup</tspan> phase</text>
    <rect x="0" y="14" width="410" height="124" rx="6" class="box"/>

    <text x="16" y="38" class="lbl">dd: 1</text>
    <text x="120" y="38" class="sub">R2  (correctness; qf barred by range)</text>

    <text x="16" y="60" class="lbl">qf: 1</text>
    <text x="120" y="60" class="sub">R4  (correctness; dd not needed)</text>

    <text x="16" y="82" class="lbl">double: 1</text>
    <text x="120" y="82" class="sub">R5  (ff rejected — settles at baseline)</text>

    <text x="16" y="104" class="lbl">ff: 1</text>
    <text x="120" y="104" class="sub">R3  (float rejected — log near root)</text>

    <text x="16" y="126" class="lbl">float: 2</text>
    <text x="120" y="126" class="sub">R1, R6  (both cleared two rungs down)</text>

    <text x="0" y="156" class="sub-sm">One precision in, five out — every rung on the ladder now carries work.</text>
  </g>
</svg>
