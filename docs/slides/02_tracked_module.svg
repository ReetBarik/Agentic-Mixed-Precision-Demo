<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #172033; }
    .subtitle { font-size: 14px; fill: #5b6475; }
    .h { font-size: 16px; font-weight: 650; fill: #172033; }
    .lbl { font-size: 14px; font-weight: 600; fill: #172033; }
    .sub { font-size: 12px; fill: #5b6475; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #172033; }
    .code-hl { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #7c2d12; font-weight: 600; }
    .math { font-family: "Cambria Math", Georgia, serif; font-style: italic; font-size: 14px; fill: #172033; }
    .box { stroke: #64748b; stroke-width: 1; fill: #f1f5f9; }
    .app-box { stroke: #1e40af; stroke-width: 1.6; fill: #dbeafe; }
    .tracked-box { stroke: #6d28d9; stroke-width: 1.6; fill: #ede9fe; }
    .journal-box { stroke: #0f766e; stroke-width: 1.6; fill: #99f6e4; }
    .callout-box { stroke: #b45309; stroke-width: 1.4; fill: #fef3c7; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .op-symbol { font-size: 30px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" class="title">Tracked datatype  —  foundation for characterization</text>
  <text x="40" y="66" class="subtitle">A generic wrapper Tracked&lt;T&gt; that replaces plain T in the app for the characterization sweep.</text>

  <!-- Row 1: instrumented op flow -->
  <text x="40" y="108" class="h">What Tracked propagates through every op</text>

  <g transform="translate(40, 130)">
    <!-- inputs -->
    <rect x="0" y="20" width="160" height="72" rx="6" class="tracked-box"/>
    <text x="80" y="42" text-anchor="middle" class="lbl">Tracked&lt;T&gt; a</text>
    <text x="80" y="60" text-anchor="middle" class="sub">value, rel_err, max_cond,</text>
    <text x="80" y="76" text-anchor="middle" class="sub">id, provenance</text>

    <rect x="0" y="120" width="160" height="72" rx="6" class="tracked-box"/>
    <text x="80" y="142" text-anchor="middle" class="lbl">Tracked&lt;T&gt; b</text>
    <text x="80" y="160" text-anchor="middle" class="sub">value, rel_err, max_cond,</text>
    <text x="80" y="176" text-anchor="middle" class="sub">id, provenance</text>

    <!-- op box (widened) -->
    <path d="M160 56 L240 100" class="edge"/>
    <path d="M160 156 L240 116" class="edge"/>

    <rect x="240" y="70" width="180" height="76" rx="6" class="app-box"/>
    <text x="330" y="102" class="op-symbol" fill="#1e40af">⊕</text>
    <text x="330" y="128" text-anchor="middle" class="sub">op (add/sub/mul/div/...)</text>

    <!-- output -->
    <path d="M420 108 L500 108" class="edge"/>
    <rect x="500" y="72" width="160" height="72" rx="6" class="tracked-box"/>
    <text x="580" y="94" text-anchor="middle" class="lbl">Tracked&lt;T&gt; c</text>
    <text x="580" y="112" text-anchor="middle" class="sub">= a ⊕ b, new id,</text>
    <text x="580" y="128" text-anchor="middle" class="sub">rel_err propagated inline</text>

    <!-- journal entry -->
    <path d="M580 144 L480 210" class="edge"/>
    <rect x="280" y="210" width="400" height="120" rx="6" class="journal-box"/>
    <text x="480" y="232" text-anchor="middle" class="lbl">journal entry (JSONL)</text>
    <text x="300" y="256" class="code">{op: "sub", scope: "R2",</text>
    <text x="300" y="272" class="code"> in:  [id(a), id(b)],   values:   [a, b],</text>
    <text x="300" y="288" class="code"> out: id(c),            out_value: c,</text>
    <text x="300" y="304" class="code"> rel_err: c.rel_err,</text>
    <text x="300" y="320" class="code-hl"> cond: (|a| + |b|) / |a − b|      ← this-op proxy</text>
  </g>

  <!-- Cond formula callout -->
  <g transform="translate(770, 130)">
    <rect x="0" y="0" width="470" height="330" rx="8" class="callout-box"/>
    <text x="20" y="26" class="h">Per-op condition-number proxy</text>
    <text x="20" y="48" class="sub">Standard forward-error definition — amplification of input perturbations:</text>

    <text x="20" y="82" class="math">κ(f, a, b)  ≈  |∂f/∂a · a/c|  +  |∂f/∂b · b/c|</text>

    <text x="20" y="118" class="lbl">Instantiated per op:</text>
    <text x="20" y="140" class="code">add/sub:   κ = (|a| + |b|) / |a ± b|      ← cancellation detector</text>
    <text x="20" y="158" class="code">mul/div:   κ = 2</text>
    <text x="20" y="176" class="code">sqrt:      κ = 1/2</text>
    <text x="20" y="194" class="code">log:       κ = 1 / |log(a)|               ← blows up near a=1</text>
    <text x="20" y="212" class="code">sub(x,x):  κ = 1                          ← exact-cancel shortcut</text>

    <text x="20" y="248" class="lbl">Accumulated rel-err bound (propagated on c):</text>
    <text x="20" y="272" class="math">rel_err(c)   ≲   κ · ( rel_err(a) + rel_err(b) )   +   u</text>
    <text x="20" y="292" class="sub">u = unit roundoff of T (double: 2⁻⁵³).  Worst-case bound —</text>
    <text x="20" y="308" class="sub">tight when errors align, loose when they cancel.</text>
  </g>

  <!-- Bottom: what Tracked produces + consumer -->
  <g transform="translate(40, 500)">
    <text x="0" y="0" class="h">Tracked's role in the pipeline</text>

    <!-- App (instrumented) -->
    <rect x="0" y="20" width="220" height="80" rx="8" class="app-box"/>
    <text x="110" y="48" text-anchor="middle" class="lbl">Instrumented app</text>
    <text x="110" y="68" text-anchor="middle" class="sub">app's native dtype T</text>
    <text x="110" y="84" text-anchor="middle" class="sub">replaced by Tracked&lt;T&gt;</text>

    <path d="M220 60 L300 60" class="edge"/>

    <!-- Tracked -->
    <rect x="300" y="20" width="220" height="80" rx="8" class="tracked-box"/>
    <text x="410" y="48" text-anchor="middle" class="lbl">Tracked&lt;T&gt;</text>
    <text x="410" y="68" text-anchor="middle" class="sub">propagates value, rel_err,</text>
    <text x="410" y="84" text-anchor="middle" class="sub">cond, provenance per op</text>

    <path d="M520 60 L600 60" class="edge"/>

    <!-- Journal -->
    <rect x="600" y="20" width="220" height="80" rx="8" class="journal-box"/>
    <text x="710" y="48" text-anchor="middle" class="lbl">Journal (JSONL)</text>
    <text x="710" y="68" text-anchor="middle" class="sub">per-op-per-sample stream</text>
    <text x="710" y="84" text-anchor="middle" class="sub">transient artifact</text>

    <path d="M820 60 L900 60" class="edge"/>

    <!-- Characterizer -->
    <rect x="900" y="20" width="220" height="80" rx="8" style="stroke:#5b6475; stroke-width:1.4; stroke-dasharray:6 4; fill:#e2e8f0;"/>
    <text x="1010" y="48" text-anchor="middle" class="lbl">Characterizer</text>
    <text x="1010" y="68" text-anchor="middle" class="sub">consumes the journal</text>
    <text x="1010" y="84" text-anchor="middle" class="sub">(next slide)</text>
  </g>
</svg>
