<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #172033; }
    .h { font-size: 16px; font-weight: 650; fill: #172033; }
    .panel-title { font-size: 15px; font-weight: 700; fill: #172033; }
    .lbl { font-size: 14px; font-weight: 600; fill: #172033; }
    .sub { font-size: 12px; fill: #5b6475; }
    .sub-sm { font-size: 11px; fill: #5b6475; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #172033; }
    .box { stroke: #64748b; stroke-width: 1; fill: #f8fafc; }
    .queue-box { stroke: #b45309; stroke-width: 1.6; fill: #fef3c7; }
    .rnode-safe { stroke: #166534; stroke-width: 1.4; fill: #bbf7d0; }
    .rnode-warn { stroke: #b45309; stroke-width: 1.6; fill: #fde68a; }
    .rnode-sing { stroke: #475569; stroke-width: 1.4; fill: #cbd5e1; }
    .rung-safest { fill: #86efac; stroke: #166534; stroke-width: 1.4; }
    .rung-base   { fill: #f1f5f9; stroke: #475569; stroke-width: 1.6; }
    .rung-mid    { fill: #fed7aa; stroke: #b45309; stroke-width: 1.4; }
    .rung-risky  { fill: #fecaca; stroke: #991b1b; stroke-width: 1.4; }
    .rung-lbl { font-size: 15px; font-weight: 700; fill: #172033; }
    .rung-sub { font-size: 11px; fill: #5b6475; }
    .arrow-corr { stroke: #b45309; stroke-width: 2.2; fill: none; }
    .arrow-speed { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
    .verdict-accept { font-weight: 700; fill: #166534; }
    .verdict-reject { font-weight: 700; fill: #991b1b; }
    .verdict-upbump { font-weight: 700; fill: #166534; }
    .th { font-size: 12px; font-weight: 700; fill: #172033; }
    .td { font-size: 12px; fill: #172033; }
  </style>
  <defs>
    <marker id="arrow-corr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-speed-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" class="title">Strategy walk — correctness phase</text>
  <text x="40" y="66" class="sub">For each region: attempt a demotion or, if unsafe at current precision, an up-bump.</text>

  <!-- ============ LEFT: precision ladder ============ -->
  <text x="40" y="108" class="h">Precision ladder</text>

  <g transform="translate(60, 130)">
    <!-- dd rung (top) -->
    <rect x="0" y="0" width="200" height="60" rx="8" class="rung-safest"/>
    <text x="100" y="26" text-anchor="middle" class="rung-lbl">dd</text>
    <text x="100" y="46" text-anchor="middle" class="rung-sub">106-bit mantissa · oracle</text>

    <!-- double rung (baseline) -->
    <rect x="0" y="90" width="200" height="60" rx="8" class="rung-base"/>
    <text x="100" y="116" text-anchor="middle" class="rung-lbl">double</text>
    <text x="100" y="136" text-anchor="middle" class="rung-sub">53-bit mantissa · baseline</text>

    <!-- ff rung -->
    <rect x="0" y="180" width="200" height="60" rx="8" class="rung-mid"/>
    <text x="100" y="206" text-anchor="middle" class="rung-lbl">ff</text>
    <text x="100" y="226" text-anchor="middle" class="rung-sub">48-bit mantissa · pair-of-floats</text>

    <!-- float rung (bottom) -->
    <rect x="0" y="270" width="200" height="60" rx="8" class="rung-risky"/>
    <text x="100" y="296" text-anchor="middle" class="rung-lbl">float</text>
    <text x="100" y="316" text-anchor="middle" class="rung-sub">24-bit mantissa · fastest</text>

    <!-- Correctness arrows: double → dd (solid) and double → ff (solid) -->
    <!-- double → dd  (curves up on the right side) -->
    <path d="M215 105 C 270 105, 270 30, 215 30" class="arrow-corr" marker-end="url(#arrow-corr-m)"/>
    <!-- double → ff (curves down on the right side) -->
    <path d="M215 135 C 270 135, 270 210, 215 210" class="arrow-corr" marker-end="url(#arrow-corr-m)"/>
    <text x="278" y="122" class="lbl" fill="#b45309">correctness</text>

    <!-- Speedup arrows (dotted): double → ff and double → float -->
    <path d="M215 135 C 330 135, 330 210, 215 210" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>
    <path d="M215 135 C 380 135, 380 300, 215 300" class="arrow-speed" marker-end="url(#arrow-speed-m)"/>
    <text x="340" y="188" class="lbl" fill="#64748b">speedup</text>

    <!-- Note under the ladder -->
    <text x="0" y="380" class="sub">↑ safer / slower</text>
    <text x="0" y="398" class="sub">↓ faster / riskier</text>
    <text x="0" y="418" class="sub">walk never re-promotes after accept</text>
  </g>

  <!-- ============ MIDDLE: correctness queue ============ -->
  <text x="500" y="108" class="h">Correctness queue  (dequeue-order)</text>

  <g transform="translate(500, 130)">
    <rect x="0" y="0" width="320" height="490" rx="8" class="queue-box"/>

    <text x="160" y="26" text-anchor="middle" class="panel-title">6 regions, predicted-safest first</text>

    <!-- queue entries (widened) -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">1.  R1   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">op_counts: 2 add, 2 mul  ·  pred_err_ff: 3e-15</text>
    </g>
    <g transform="translate(16, 102)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">2.  R5   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">1 sqrt, 1 mul, 1 add  ·  pred_err_ff: 5e-15</text>
    </g>
    <g transform="translate(16, 158)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">3.  R6   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">1 mul, 1 add, 1 sub  ·  pred_err_ff: 7e-15</text>
    </g>
    <g transform="translate(16, 214)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-safe"/>
      <text x="10" y="18" class="lbl">4.  R4   double → dd  (up-bump)</text>
      <text x="10" y="36" class="sub-sm">1 div, 1 add, 1 sub  ·  pred_err_double: hi</text>
    </g>
    <g transform="translate(16, 270)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-sing"/>
      <text x="10" y="18" class="lbl">5.  R3   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">1 log, 1 add  ·  pred_err_ff: 4e-10  (log)</text>
    </g>
    <g transform="translate(16, 326)">
      <rect x="0" y="0" width="288" height="46" rx="6" class="rnode-warn"/>
      <text x="10" y="18" class="lbl">6.  R2   double → ff  (demote)</text>
      <text x="10" y="36" class="sub-sm">2 mul, 1 sub  ·  pred_err_ff: 2e-9  (cancel)</text>
    </g>

    <!-- Prune-check callout -->
    <g transform="translate(16, 400)">
      <text x="0" y="0" class="lbl">Prune check at dequeue</text>
      <text x="0" y="18" class="sub-sm">float_range_ok: applies only when target is float</text>
      <text x="0" y="34" class="sub-sm">(no effect this phase — correctness targets dd or ff)</text>
      <text x="0" y="52" class="sub-sm">chain-dedup: no matches yet (first pass)</text>
    </g>
  </g>

  <!-- ============ RIGHT: walk trace + result ============ -->
  <text x="850" y="108" class="h">Walk trace</text>

  <g transform="translate(850, 130)">
    <rect x="0" y="0" width="410" height="340" rx="8" class="box"/>

    <!-- header (widened columns) -->
    <rect x="0" y="0" width="410" height="26" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="10" y="18" class="th">step</text>
    <text x="50" y="18" class="th">region</text>
    <text x="115" y="18" class="th">attempt</text>
    <text x="240" y="18" class="th">verdict</text>
    <text x="320" y="18" class="th">new state</text>

    <!-- rows -->
    <g font-size="12" fill="#172033">
      <rect x="0" y="26" width="410" height="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="44">1</text>
      <text x="50" y="44">R1</text>
      <text x="115" y="44">double → ff</text>
      <text x="240" y="44" class="verdict-accept">accept</text>
      <text x="320" y="44">R1 = ff</text>

      <rect x="0" y="54" width="410" height="28" fill="#fff" stroke="#e2e8f0"/>
      <text x="10" y="72">2</text>
      <text x="50" y="72">R5</text>
      <text x="115" y="72">double → ff</text>
      <text x="240" y="72" class="verdict-accept">accept</text>
      <text x="320" y="72">R5 = ff</text>

      <rect x="0" y="82" width="410" height="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="100">3</text>
      <text x="50" y="100">R6</text>
      <text x="115" y="100">double → ff</text>
      <text x="240" y="100" class="verdict-accept">accept</text>
      <text x="320" y="100">R6 = ff</text>

      <rect x="0" y="110" width="410" height="46" fill="#dcfce7" stroke="#86efac"/>
      <text x="10" y="130">4</text>
      <text x="50" y="130">R4</text>
      <text x="115" y="130">double → dd</text>
      <text x="240" y="130" class="verdict-upbump">accept ↑</text>
      <text x="320" y="130">R4 = dd</text>
      <text x="50" y="148" class="sub-sm" font-style="italic">up-bump: cascade from R1+R2 pushes rel-err past tol at double</text>

      <rect x="0" y="156" width="410" height="28" fill="#fff" stroke="#e2e8f0"/>
      <text x="10" y="174">5</text>
      <text x="50" y="174">R3</text>
      <text x="115" y="174">double → ff</text>
      <text x="240" y="174" class="verdict-accept">accept</text>
      <text x="320" y="174">R3 = ff</text>

      <rect x="0" y="184" width="410" height="28" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="10" y="202">6</text>
      <text x="50" y="202">R2</text>
      <text x="115" y="202">double → ff</text>
      <text x="240" y="202" class="verdict-accept">accept</text>
      <text x="320" y="202">R2 = ff</text>
    </g>

    <g transform="translate(10, 244)">
      <text x="0" y="0" class="sub-sm">Each (region, target) pair tried at most once per run — no</text>
      <text x="0" y="16" class="sub-sm">re-attempts, no rollback.</text>
      <text x="0" y="38" class="sub-sm">R4's dd acceptance seeds an already-safer starting point;</text>
      <text x="0" y="54" class="sub-sm">the speedup phase still attempts double → float on it.</text>
      <text x="0" y="76" class="sub-sm">All other regions become speedup candidates from double baseline.</text>
    </g>
  </g>

  <!-- Precision distribution after correctness phase -->
  <g transform="translate(850, 500)">
    <text x="0" y="0" class="h">State after correctness phase</text>
    <rect x="0" y="14" width="410" height="100" rx="6" class="box"/>

    <text x="16" y="38" class="lbl">dd: 1</text>
    <text x="120" y="38" class="sub">R4  (up-bumped from double)</text>

    <text x="16" y="60" class="lbl">double: 0</text>
    <text x="120" y="60" class="sub">all regions moved off the baseline</text>

    <text x="16" y="82" class="lbl">ff: 5</text>
    <text x="120" y="82" class="sub">R1, R2, R3, R5, R6</text>

    <text x="16" y="104" class="lbl">float: 0</text>
    <text x="120" y="104" class="sub">correctness never targets float</text>
  </g>
</svg>
