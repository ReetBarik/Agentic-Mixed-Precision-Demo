<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #172033; }
    .h { font-size: 16px; font-weight: 650; fill: #172033; }
    .lbl { font-size: 14px; font-weight: 600; fill: #172033; }
    .sub { font-size: 12px; fill: #5b6475; }
    .sub-sm { font-size: 11px; fill: #5b6475; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; fill: #172033; }
    .box { stroke: #64748b; stroke-width: 1; fill: #f8fafc; }
    .strat-box { stroke: #b45309; stroke-width: 1.6; fill: #fef3c7; }
    .llm-box { stroke: #be185d; stroke-width: 1.8; fill: #fce7f3; }
    .build-box { stroke: #1e40af; stroke-width: 1.6; fill: #dbeafe; }
    .val-box { stroke: #0f766e; stroke-width: 1.6; fill: #99f6e4; }
    .oracle-box { stroke: #6d28d9; stroke-width: 1.6; fill: #ede9fe; }
    .integrator-box { stroke: #475569; stroke-width: 1; fill: #f1f5f9; }
    .verdict-accept-box { stroke: #166534; stroke-width: 2; fill: #bbf7d0; }
    .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .edge-loop { stroke: #be185d; stroke-width: 2; fill: none; marker-end: url(#arrow-loop); stroke-dasharray: 5 3; }
    .edge-back { stroke: #166534; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be185d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="44" class="title">Patcher &amp; Validator — inside one walk step</text>
  <text x="40" y="66" class="sub">Zoom into R4's correctness-phase attempt (double → dd): shim generation, build, validation, verdict.</text>

  <!-- =================== TOP ROW: Strategy handoff =================== -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="230" height="70" rx="8" class="strat-box"/>
    <text x="115" y="26" text-anchor="middle" class="lbl">Strategy walk</text>
    <text x="115" y="46" text-anchor="middle" class="sub">hands off (region, target,</text>
    <text x="115" y="62" text-anchor="middle" class="sub">headers, existing shims)</text>
  </g>

  <!-- Candidate handoff detail (widened) -->
  <g transform="translate(290, 108)">
    <rect x="0" y="0" width="290" height="74" rx="6" class="box"/>
    <text x="12" y="20" class="code">candidate = {</text>
    <text x="12" y="36" class="code">  region:  R4,</text>
    <text x="12" y="52" class="code">  target:  dd,</text>
    <text x="12" y="68" class="code">  headers: [kernel.hpp], shims: [] }</text>
  </g>

  <!-- Arrow to Patcher loop -->
  <path d="M270 145 L 290 145" class="edge"/>
  <path d="M580 145 L 680 250" class="edge"/>

  <!-- =================== Precision containers ABOVE Patcher =================== -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="150" height="60" rx="8" class="integrator-box"/>
    <text x="75" y="24" text-anchor="middle" class="lbl">dd_math.hpp</text>
    <text x="75" y="44" text-anchor="middle" class="sub-sm">pair-of-doubles</text>
  </g>
  <g transform="translate(870, 100)">
    <rect x="0" y="0" width="150" height="60" rx="8" class="integrator-box"/>
    <text x="75" y="24" text-anchor="middle" class="lbl">ff_math.hpp</text>
    <text x="75" y="44" text-anchor="middle" class="sub-sm">pair-of-floats</text>
  </g>
  <text x="860" y="180" text-anchor="middle" class="sub-sm" fill="#5b6475">precision containers (app-side headers)</text>

  <!-- Arrows from containers into Patcher block (top edge of dashed pink) -->
  <path d="M775 160 L 800 240" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
  <path d="M945 160 L 920 240" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>

  <!-- =================== MIDDLE: Patcher (retry loop) =================== -->
  <g transform="translate(660, 240)">
    <!-- Loop container -->
    <rect x="0" y="0" width="380" height="170" rx="10" fill="none" stroke="#be185d" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="190" y="22" text-anchor="middle" class="lbl" fill="#be185d">Patcher retry loop  (k ≤ dr_k, default 60)</text>

    <!-- LLM call -->
    <rect x="30" y="42" width="140" height="72" rx="8" class="llm-box"/>
    <text x="100" y="68" text-anchor="middle" class="lbl">LLM call</text>
    <text x="100" y="86" text-anchor="middle" class="sub-sm">generate shim</text>
    <text x="100" y="102" text-anchor="middle" class="sub-sm">R4_dd.hpp</text>

    <!-- Arrow to build -->
    <path d="M170 78 L 210 78" class="edge"/>

    <!-- Build attempt -->
    <rect x="210" y="42" width="140" height="72" rx="8" class="build-box"/>
    <text x="280" y="68" text-anchor="middle" class="lbl">Build</text>
    <text x="280" y="86" text-anchor="middle" class="sub-sm">cmake + compile</text>
    <text x="280" y="102" text-anchor="middle" class="sub-sm">with shim installed</text>

    <!-- Retry back arrow: loop back to LLM, path goes BELOW the boxes -->
    <path d="M280 114 C 280 148, 100 148, 100 114" class="edge-loop"/>
  </g>

  <!-- Retry label OUTSIDE the loop container, to the right of the arc -->
  <text x="1060" y="380" class="sub-sm" fill="#be185d">on gen/build</text>
  <text x="1060" y="395" class="sub-sm" fill="#be185d">failure → retry</text>

  <!-- On-success text OUTSIDE the Patcher container -->
  <text x="850" y="440" text-anchor="middle" class="sub">On success: built binary → Validator.</text>
  <text x="850" y="458" text-anchor="middle" class="sub-sm">On k = dr_k exhausted: report failure to strategy; region parks at safest known rung.</text>

  <!-- =================== VERTICAL arrow down to Validator (candidate side, right end) =================== -->
  <path d="M960 470 L 960 490" class="edge"/>

  <!-- =================== BOTTOM: Validator (RIGHT-to-LEFT flow) =================== -->
  <g transform="translate(300, 490)">
    <!-- Validator container -->
    <rect x="0" y="0" width="760" height="200" rx="10" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="380" y="22" text-anchor="middle" class="lbl" fill="#0f766e">Validator</text>

    <!-- Verdict box (LEFTMOST) -->
    <rect x="20" y="60" width="160" height="80" rx="8" class="verdict-accept-box"/>
    <text x="100" y="86" text-anchor="middle" class="lbl">Verdict: accept</text>
    <text x="100" y="106" text-anchor="middle" class="sub-sm">R4 rel-err ≤ tol</text>
    <text x="100" y="122" text-anchor="middle" class="sub-sm">no regression</text>

    <!-- Random battery (MIDDLE) -->
    <rect x="240" y="45" width="220" height="120" rx="8" class="val-box"/>
    <text x="350" y="72" text-anchor="middle" class="lbl">Random battery</text>
    <text x="350" y="92" text-anchor="middle" class="sub-sm">n=1000 seeded inputs</text>
    <text x="350" y="110" text-anchor="middle" class="sub-sm">per-output-component rel-err vs oracle</text>
    <text x="350" y="132" text-anchor="middle" class="sub-sm">absolute floor: tol = 7</text>
    <text x="350" y="150" text-anchor="middle" class="sub-sm">regression guard vs baseline</text>

    <!-- Candidate binary (TOP RIGHT) -->
    <rect x="530" y="45" width="200" height="55" rx="8" class="build-box"/>
    <text x="630" y="70" text-anchor="middle" class="lbl">Candidate binary</text>
    <text x="630" y="88" text-anchor="middle" class="sub-sm">R4 = dd</text>

    <!-- DD oracle (BOTTOM RIGHT) -->
    <rect x="530" y="115" width="200" height="55" rx="8" class="oracle-box"/>
    <text x="630" y="140" text-anchor="middle" class="lbl">dd oracle</text>
    <text x="630" y="158" text-anchor="middle" class="sub-sm">all regions at dd</text>

    <!-- Right-to-left arrows: candidate & oracle → battery → verdict -->
    <path d="M530 72 L 460 90" class="edge"/>
    <path d="M530 142 L 460 130" class="edge"/>
    <path d="M240 100 L 180 100" class="edge"/>
  </g>

  <!-- =================== FEEDBACK arrow: verdict box UP to Strategy =================== -->
  <path d="M380 550 C 300 550, 250 400, 155 180" class="edge-back"/>
  <text x="230" y="380" class="lbl" style="fill:#166534">accept → R4 = dd</text>
  <text x="230" y="398" class="sub-sm">strategy commits state,</text>
  <text x="230" y="414" class="sub-sm">dequeues next region</text>

  <!-- =================== Possible outcomes summary (bottom left) =================== -->
  <g transform="translate(40, 490)">
    <rect x="0" y="0" width="240" height="200" rx="8" class="box"/>
    <text x="120" y="22" text-anchor="middle" class="lbl">Possible outcomes</text>
    <text x="16" y="52" class="sub-sm">• accept — precision committed</text>
    <text x="16" y="70" class="sub-sm">  (shown above for R4 = dd)</text>
    <text x="16" y="98" class="sub-sm">• reject — region stays at prior state</text>
    <text x="16" y="116" class="sub-sm">  (tolerance or regression fired)</text>
    <text x="16" y="144" class="sub-sm">• patcher failure — retry loop</text>
    <text x="16" y="162" class="sub-sm">  exhausted; region parks at</text>
    <text x="16" y="180" class="sub-sm">  safest known rung</text>
  </g>
</svg>
