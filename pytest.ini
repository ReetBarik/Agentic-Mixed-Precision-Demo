[pytest]
# Scope collection to AMP's own suite: the vendored Tracked subtree ships its
# own test suite (third_party/tracked/tools/tests, run in that repo's CI), and
# collecting it here would double-run it and couple AMP's baseline to it.
# (norecursedirs REPLACES pytest's defaults, so the defaults are restated.)
norecursedirs = .* build dist venv node_modules third_party .venv312 .venv
