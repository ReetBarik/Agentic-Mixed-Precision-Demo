<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 848"
     width="1140" height="848" role="img"
     aria-label="Precision assignment and expected GB300 speedup for the qcdloop
     workload. Two pie charts and a bar chart. By integral count: ff 14 of 21,
     double 5 of 21, qf 2 of 21. By math operations: double 51.53 percent, ff 38.36
     percent, qf 10.11 percent of 19,443,258 ops. float and dd are unused. The 5 double-routed integrals are 23.8% of the integrals but 51.5% of the ops. Op counts, not cost; every integral sampled equally.
     Per-integral iso-accuracy speedup on GB300, whole app 3.61 times:
     B1 3.27, B2 2.28, B3 2.03, B4 2.16, B5 2.10, B6 3.61, B7 3.11, B8 2.10, B9 2.71, B10 2.09, B11 3.23, B12 7.67 against dd, 0.23 against double, B13 1.97, B14 3.22, B15 1.38, B16 6.13 against dd, 0.16 against double, BIN0 1.00, BIN1 1.00, BIN2 1.00, BIN3 1.00, BIN4 1.00. log and atan2 are 3% of ops but 69% of modelled time, so the transcendental-heavy integrals gain least.">
