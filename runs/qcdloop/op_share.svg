<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470"
     width="1140" height="470" role="img"
     aria-label="Precision assignment for the qcdloop workload, two pie charts. By
     integral count: ff 14 of 21, double 5 of 21, qf 2 of 21. By math operations:
     double 51.53 percent, ff 38.36 percent, qf 10.11 percent of 19,443,258 ops. float
     and dd are unused. The 5 double-routed integrals are 23.8% of the integrals but 51.5% of the ops. Op counts, not cost; every integral sampled equally.">
  <style>
    /* Light theme lives on the elements as presentation attributes, so renderers that
       ignore CSS (PowerPoint) still get real colors.  This block only overrides for
       dark mode; presentation attributes lose to any selector, so browsers apply it. */
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #1a1a19; }
      .sep  { stroke: #1a1a19; }
      .ink  { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .s-float { fill: #9085e9; }
      .s-ff { fill: #d95926; }
      .s-double { fill: #3987e5; }
      .s-qf { fill: #199e70; }
      .s-dd { fill: #d55181; }
    }
  </style>
