    <text x="570" y="452" text-anchor="middle" class="ink2" font-size="12"
          fill="#52514e">The 5 double-routed integrals are 23.8% of the integrals but 51.5% of the ops. Op counts, not cost; every integral sampled equally.</text>
    <text x="570" y="809" text-anchor="middle" class="ink2" font-size="12"
          fill="#52514e">log and atan2 are 3% of ops but 69% of modelled time, so the transcendental-heavy integrals gain least.</text>
    <text x="570" y="831" text-anchor="middle" class="ink2" font-size="12"
          fill="#52514e">Throughput model only — no occupancy or register pressure, which would cost the 4-limb qf integrals most.</text>
