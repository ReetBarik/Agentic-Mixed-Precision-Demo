<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"
     width="1000" height="470" role="img"
     aria-label="Precision assignment for the qcdloop workload, two pie charts. By math
     operations: double 51.53 percent, ff 38.36 percent, qf 10.11 percent of 19,443,258
     ops. By integral count: ff 14 of 21, double 5 of 21, qf 2 of 21. float and dd
     are unused. The 5 double-routed integrals are 23.8% of the integrals but 51.5% of the ops. Op counts, not cost; every integral sampled equally.">
  <style>
    :root {
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink2: #52514e;
      --s-float: #4a3aa7;
      --s-ff: #eb6834;
      --s-double: #2a78d6;
      --s-qf: #1baf7a;
      --s-dd: #e87ba4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1a1a19;
        --ink: #ffffff;
        --ink2: #c3c2b7;
        --s-float: #9085e9;
        --s-ff: #d95926;
        --s-double: #3987e5;
        --s-qf: #199e70;
        --s-dd: #d55181;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ttl  { font-size: 17px; font-weight: 600; fill: var(--ink); }
    .sub  { font-size: 12.5px; fill: var(--ink2); }
    .lbl  { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .pct  { font-weight: 400; fill: var(--ink2); }
    .leg  { font-size: 12.5px; fill: var(--ink); }
    .legp { fill: var(--ink2); }
    .cap  { font-size: 12px; fill: var(--ink2); }
  </style>
