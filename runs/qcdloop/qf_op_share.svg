<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 444"
     width="1000" height="444" role="img"
     aria-label="Math ops by precision rung. Control: double 51.53 percent, ff 38.36
     percent, dd 10.11 percent. QF run: double 51.53 percent, ff 38.36 percent, qf
     10.11 percent. Total 19,443,258 ops.">
  <style>
    :root {
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink2: #52514e;
      --s-float: #4a3aa7;
      --s-ff: #eb6834;
      --s-double: #2a78d6;
      --s-qf: #1baf7a;
      --s-dd: #e87ba4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1a1a19;
        --ink: #ffffff;
        --ink2: #c3c2b7;
        --s-float: #9085e9;
        --s-ff: #d95926;
        --s-double: #3987e5;
        --s-qf: #199e70;
        --s-dd: #d55181;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ttl  { font-size: 17px; font-weight: 600; fill: var(--ink); }
    .sub  { font-size: 12.5px; fill: var(--ink2); }
    .lbl  { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .pct  { font-weight: 400; fill: var(--ink2); }
    .leg  { font-size: 12.5px; fill: var(--ink); }
    .legp { fill: var(--ink2); }
    .cap  { font-size: 12px; fill: var(--ink2); }
  </style>
  <rect width="1000" height="444" fill="var(--surface)"/>
    <text x="235.0" y="28" text-anchor="middle" class="ttl">control</text>
    <text x="235.0" y="52" text-anchor="middle" class="sub">qf rung absent</text>
    <path d="M 235.00 248.00 L 235.00 130.00 A 118.00 118.00 0 1 1 223.69 365.46 Z" fill="var(--s-double)" stroke="var(--surface)" stroke-width="2"/>
    <text x="378.8" y="254.9" text-anchor="start" class="lbl">double <tspan class="pct">51.53%</tspan></text>
    <path d="M 235.00 248.00 L 223.69 365.46 A 118.00 118.00 0 0 1 165.00 153.01 Z" fill="var(--s-ff)" stroke="var(--surface)" stroke-width="2"/>
    <text x="96.2" y="286.3" text-anchor="end" class="lbl">ff <tspan class="pct">38.36%</tspan></text>
    <path d="M 235.00 248.00 L 165.00 153.01 A 118.00 118.00 0 0 1 235.00 130.00 Z" fill="var(--s-dd)" stroke="var(--surface)" stroke-width="2"/>
    <text x="190.0" y="111.2" text-anchor="end" class="lbl">dd <tspan class="pct">10.11%</tspan></text>
    <text x="735.0" y="28" text-anchor="middle" class="ttl">qf run</text>
    <text x="735.0" y="52" text-anchor="middle" class="sub">qf rung present</text>
    <path d="M 735.00 248.00 L 735.00 130.00 A 118.00 118.00 0 1 1 723.69 365.46 Z" fill="var(--s-double)" stroke="var(--surface)" stroke-width="2"/>
    <text x="878.8" y="254.9" text-anchor="start" class="lbl">double <tspan class="pct">51.53%</tspan></text>
    <path d="M 735.00 248.00 L 723.69 365.46 A 118.00 118.00 0 0 1 665.00 153.01 Z" fill="var(--s-ff)" stroke="var(--surface)" stroke-width="2"/>
    <text x="596.2" y="286.3" text-anchor="end" class="lbl">ff <tspan class="pct">38.36%</tspan></text>
    <path d="M 735.00 248.00 L 665.00 153.01 A 118.00 118.00 0 0 1 735.00 130.00 Z" fill="var(--s-qf)" stroke="var(--surface)" stroke-width="2"/>
    <text x="690.0" y="111.2" text-anchor="end" class="lbl">qf <tspan class="pct">10.11%</tspan></text>
    <rect x="219.2" y="396" width="12" height="12" rx="3" fill="var(--s-float)"/>
    <text x="238.2" y="406" class="leg">float <tspan class="legp">0.00%</tspan></text>
    <rect x="344.0" y="396" width="12" height="12" rx="3" fill="var(--s-ff)"/>
    <text x="363.0" y="406" class="leg">ff <tspan class="legp">38.36%</tspan></text>
    <rect x="454.2" y="396" width="12" height="12" rx="3" fill="var(--s-double)"/>
